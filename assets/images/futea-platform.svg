<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>
  
  <!-- Stylized Pitch in perspective -->
  <g transform="translate(150, 70) scale(0.65)">
    <polygon points="100,50 660,50 740,420 20,420" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.6" filter="url(#neon)"/>
    <line x1="380" y1="50" x2="380" y2="420" stroke="#10b981" stroke-width="2" opacity="0.5"/>
    <ellipse cx="380" cy="235" rx="110" ry="50" fill="none" stroke="#10b981" stroke-width="2" opacity="0.5"/>
    <polygon points="260,50 500,50 515,130 245,130" fill="none" stroke="#06b6d4" stroke-width="1.8" opacity="0.5"/>
    <polygon points="230,420 530,420 515,330 245,330" fill="none" stroke="#06b6d4" stroke-width="1.8" opacity="0.5"/>
  </g>
  
  <!-- Data nodes & tracking signals -->
  <circle cx="280" cy="180" r="6" fill="#10b981" filter="url(#neon)"/>
  <circle cx="280" cy="180" r="16" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
  <circle cx="420" cy="240" r="7" fill="#06b6d4" filter="url(#neon)"/>
  <circle cx="520" cy="170" r="5" fill="#3b82f6" filter="url(#neon)"/>
  <circle cx="350" cy="310" r="6" fill="#10b981" filter="url(#neon)"/>
  
  <!-- Media / Stream Overlay Card -->
  <g transform="translate(50, 60)">
    <rect width="290" height="120" rx="12" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <circle cx="30" cy="35" r="12" fill="#10b981" opacity="0.2"/>
    <path d="M26 28 L37 35 L26 42 Z" fill="#10b981"/>
    <text x="54" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">FUTEA SPORTS TECH</text>
    <text x="30" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Multimedia &amp; Broadcast Engine</text>
    <rect x="30" y="88" width="85" height="20" rx="10" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="40" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#10b981">4K STREAM</text>
    <rect x="125" y="88" width="90" height="20" rx="10" fill="rgba(6, 182, 212, 0.15)"/>
    <text x="135" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#06b6d4">AI METRICS</text>
  </g>
  
  <!-- Telemetry Badge -->
  <g transform="translate(510, 280)">
    <rect width="240" height="110" rx="12" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1.5"/>
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#06b6d4">LIVE MATCH TELEMETRY</text>
    <text x="20" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">98.4%</text>
    <text x="110" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#10b981">Sync Accuracy</text>
    <rect x="20" y="78" width="200" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="20" y="78" width="190" height="6" rx="3" fill="url(#accent)"/>
  </g>
</svg>