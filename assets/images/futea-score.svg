<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="score-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="score-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow-panel">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#score-bg)"/>
  
  <!-- Scoreboard Main Panel -->
  <g transform="translate(100, 50)">
    <rect width="600" height="340" rx="18" fill="rgba(15, 23, 42, 0.95)" stroke="rgba(16, 185, 129, 0.45)" stroke-width="2" filter="url(#glow-panel)"/>
    
    <!-- Top Header -->
    <rect x="0" y="0" width="600" height="55" rx="18" fill="rgba(30, 41, 59, 0.7)"/>
    <circle cx="35" cy="28" r="6" fill="#ef4444"/>
    <text x="52" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ef4444">EN VIVO</text>
    <text x="270" y="34" font-family="monospace" font-size="20" font-weight="bold" fill="#10b981">78:42</text>
    <rect x="475" y="15" width="105" height="26" rx="13" fill="rgba(16,185,129,0.18)"/>
    <text x="490" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#10b981">FUTEA SCORE</text>
    
    <!-- Score Center -->
    <text x="70" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">TEAM NORTE</text>
    <text x="70" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Posesión: 58%</text>
    
    <text x="245" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff">3</text>
    <text x="295" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="300" fill="#64748b">-</text>
    <text x="325" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#10b981">2</text>
    
    <text x="420" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#f8fafc">TEAM SUR</text>
    <text x="420" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#94a3b8">Posesión: 42%</text>
    
    <!-- Match Stats Bars -->
    <g transform="translate(50, 195)">
      <text x="20" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Tiros a Puerta</text>
      <text x="200" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">9</text>
      <text x="285" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#10b981">6</text>
      <rect x="20" y="24" width="210" height="6" rx="3" fill="#3b82f6"/>
      <rect x="270" y="24" width="210" height="6" rx="3" fill="#10b981"/>
      
      <text x="20" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Pases Precisos</text>
      <text x="200" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">412</text>
      <text x="285" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#10b981">328</text>
      <rect x="20" y="70" width="210" height="6" rx="3" fill="#3b82f6"/>
      <rect x="270" y="70" width="170" height="6" rx="3" fill="#10b981"/>
    </g>
    
    <!-- Footer -->
    <line x1="0" y1="300" x2="600" y2="300" stroke="rgba(255,255,255,0.08)"/>
    <circle cx="35" cy="320" r="4" fill="#10b981"/>
    <text x="48" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">WebSockets Live Sync &bull; Latencia &lt; 40ms &bull; Plataforma en Tiempo Real</text>
  </g>
</svg>