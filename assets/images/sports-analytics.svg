<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="perf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#perf-bg)"/>
  
  <!-- Radar Chart -->
  <g transform="translate(240, 225)">
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
    <line x1="0" y1="-120" x2="0" y2="120" stroke="rgba(255,255,255,0.1)"/>
    <line x1="-104" y1="-60" x2="104" y2="60" stroke="rgba(255,255,255,0.1)"/>
    <line x1="-104" y1="60" x2="104" y2="-60" stroke="rgba(255,255,255,0.1)"/>
    
    <polygon points="0,-110 90,-50 75,45 -20,95 -85,50 -90,-45" fill="rgba(16, 185, 129, 0.35)" stroke="#10b981" stroke-width="2.5"/>
    
    <text x="0" y="-130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Velocidad Sprint</text>
    <text x="130" y="-60" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Resistencia</text>
    <text x="130" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Pase Clave</text>
    <text x="0" y="145" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Recuperación</text>
    <text x="-130" y="70" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Duelos 1v1</text>
    <text x="-130" y="-60" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Presión Alta</text>
  </g>
  
  <!-- Insights panel -->
  <g transform="translate(480, 70)">
    <rect width="270" height="310" rx="16" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
    <text x="25" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Big Data &amp; Sports Science</text>
    <text x="25" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Análisis de Rendimiento Físico</text>
    
    <g transform="translate(25, 95)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Distancia Recorrida</text>
      <text x="0" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#10b981">11.4 km/partido</text>
    </g>
    
    <g transform="translate(25, 165)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Sprints en Alta Velocidad</text>
      <text x="0" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#38bdf8">920 m (&gt;24km/h)</text>
    </g>
    
    <g transform="translate(25, 235)">
      <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#cbd5e1">Modelo de Prevención de Cargas</text>
      <text x="0" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#f59e0b">Riesgo Bajo (12%)</text>
    </g>
  </g>
</svg>