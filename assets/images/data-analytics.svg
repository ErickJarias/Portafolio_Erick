<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="data-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="grad-chart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#data-bg)"/>
  
  <!-- Top Stat Cards -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="205" height="95" rx="14" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1.5"/>
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Conversion Rate (CR)</text>
    <text x="20" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#38bdf8">+24.8%</text>
    <text x="135" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#10b981">&#8593; QoQ</text>
    
    <rect x="235" y="0" width="205" height="95" rx="14" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>
    <text x="255" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">LTV / CAC Ratio</text>
    <text x="255" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#10b981">4.2x</text>
    <text x="330" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#10b981">Optimizado</text>
    
    <rect x="470" y="0" width="205" height="95" rx="14" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5"/>
    <text x="490" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Usuarios Analizados</text>
    <text x="490" y="65" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#c084fc">180K+</text>
  </g>
  
  <!-- Main Chart Section -->
  <g transform="translate(60, 160)">
    <rect width="420" height="240" rx="16" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.08)"/>
    <text x="25" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Growth &amp; Acquisition Funnel Trend</text>
    
    <!-- Area Chart -->
    <path d="M30,190 C90,170 140,110 200,130 C260,150 310,70 390,50 L390,200 L30,200 Z" fill="url(#grad-chart)"/>
    <path d="M30,190 C90,170 140,110 200,130 C260,150 310,70 390,50" fill="none" stroke="#06b6d4" stroke-width="3"/>
    
    <!-- Data points -->
    <circle cx="200" cy="130" r="5" fill="#38bdf8"/>
    <circle cx="390" cy="50" r="6" fill="#10b981"/>
  </g>
  
  <!-- Segment Breakdown Side Panel -->
  <g transform="translate(510, 160)">
    <rect width="230" height="240" rx="16" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Retención por Cohortes</text>
    
    <text x="20" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Búsqueda Orgánica</text>
    <rect x="20" y="85" width="190" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="20" y="85" width="160" height="8" rx="4" fill="#10b981"/>
    
    <text x="20" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Paid Growth &amp; Ads</text>
    <rect x="20" y="130" width="190" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="20" y="130" width="135" height="8" rx="4" fill="#06b6d4"/>
    
    <text x="20" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Direct &amp; Comunidad</text>
    <rect x="20" y="175" width="190" height="8" rx="4" fill="rgba(255,255,255,0.1)"/>
    <rect x="20" y="175" width="175" height="8" rx="4" fill="#a855f7"/>
    
    <text x="20" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b">Pipeline: Python &bull; SQL &bull; Pandas</text>
  </g>
</svg>